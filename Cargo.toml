[workspace]
resolver = "3"
members = [
    "heidi-credentials/rust",
    "heidi-crypto/rust",
    "heidi-dcql/rust",
    "heidi-issuance/rust",
    "heidi-presentation/rust",
    "heidi-trust/rust",
    "heidi-util/rust",
    "heidi-wallet/rust",
    "heidi-pdf/rust",
]
[workspace.dependencies]
serde_json = "1.0.133"
sha2 = "0.10.8"
chrono = "0.4.39"
anyhow = "1.0.98"
uniffi = { version = "=0.28.3" }
base64 = "0.22.1"
ciborium = "0.2.2"
serde = { version = "1.0.216", features = ["derive"] }
rand = "0.8.5"
p256 = { version = "0.13.2", features = ["ecdsa"] }
p384 = "0.13.1"
libc = "0.2"
tokio = { version = "1.38.0" }
reqwest = { version = "0.11", default-features = false, features = [
    "rustls-tls",
     "cookies",
     "json",
] }
heidi-x509 = { git = "https://github.com/heidiverse/heidi-x509.git" }
heidi-jwt = { git = "https://github.com/heidiverse/heidi-jwt", tag = "v0.2.0" }
serde_with_macros = "3.16.1"
jsonschema = { version = "0.17", default-features = false }
openidconnect-federation = { git = "https://github.com/UbiqueInnovation/openidconnect-federation.git", branch = "main" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
ark-serialize = "0.4.2"
josekit = { git = "https://github.com/heidiverse/josekit-rs.git", default-features = false, features = [
    "rustcrypto",
] }
zkp-util = { git = "https://github.com/heidiverse/zk-bridge-services.git", branch = "feature/new-zkp" }
rdf-util = { git = "https://github.com/heidiverse/zk-bridge-services.git", branch = "feature/new-zkp" }
next-gen-signatures = { git = "https://github.com/heidiverse/zk-bridge-services.git", features = [
    "zkp",
], branch = "feature/new-zkp" }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
debug = false

[patch."https://github.com/zaverucha/signature-proof"]
# patches signature-proof to not enable pasta curves
halo2curves = { git = "https://github.com/heidiverse/signature-proof.git" }
