[workspace]
resolver = "3"
members = [
    "kapun-credentials/rust",
    "kapun-crypto/rust",
    "kapun-dcql/rust",
    "kapun-issuance/rust",
    "kapun-presentation/rust",
    "kapun-trust/rust",
    "kapun-util/rust",
    "kapun-wallet/rust",
    "kapun-pdf/rust",
    "crates/zkp-util",
    "crates/rdf-util",
    "crates/kapun-x509/kapun-x509",
     "crates/kapun-x509/kapun-x509-cli"
, "crates/kapun-crypto-provider"]
[workspace.dependencies]
serde_json = "1.0.149"
sha2 = "0.10.8"
chrono = "0.4.39"
anyhow = "1.0.98"
uniffi = { version = "=0.28.3" }
base64 = "0.22.1"
ciborium = "0.2.2"
serde = { version = "1.0.216", features = ["derive"] }
rand = "0.8.5"
p256 = { version = "0.13.2", features = ["ecdsa"] }
p384 = "0.13.1"
libc = "0.2"
tokio = { version = "1.38.0" }
reqwest = { version = "0.11", default-features = false, features = [
    "rustls-tls",
     "cookies",
     "json",
] }
kapun-x509 = { path = "crates/kapun-x509/kapun-x509" }
heidi-jwt = { git = "https://github.com/heidiverse/heidi-jwt", tag = "v0.2.0" }
serde_with_macros = "3.16.1"
jsonschema = { version = "0.17", default-features = false }
openidconnect-federation = { git = "https://github.com/UbiqueInnovation/openidconnect-federation.git", branch = "main" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
ark-serialize = "0.4.2"
josekit = { git = "https://github.com/heidiverse/josekit-rs.git", default-features = false, features = [
    "rustcrypto",
] }
zkp-util = { path = "crates/zkp-util" }
rdf-util = { path = "crates/rdf-util"}
next-gen-signatures = { git = "https://github.com/heidiverse/zk-bridge-services.git", features = [
    "zkp",
] }


ark-bls12-381 = { version = "^0.4.0", default-features = false, features = [
    "curve",
] }
ark-ec = { version = "^0.4.1", default-features = false }
ark-ff = { version = "^0.4.1", default-features = false }
ark-secp256r1 = { version = "^0.4.0", default-features = false }

ark-std = { version = "^0.4.0", default-features = false }
bbs_plus = { version = "0.24.0", default-features = false, features = [
    "parallel",
] }
blake2 = { version = "0.10", default-features = false }
dock_crypto_utils = { version = "0.22.0", default-features = false }
multibase = { version = "0.9.2" }
num-bigint = { version = "0.4.6" }
ureq = "3.3.0"

[profile.dev]
debug = false

[patch."https://github.com/zaverucha/signature-proof"]
# patches signature-proof to not enable pasta curves
halo2curves = { git = "https://github.com/heidiverse/signature-proof.git" }
